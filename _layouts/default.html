<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en_US' }}">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description"
    content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

  <!-- Fonts and Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="/assets/css/site.css">

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <meta name="theme-color" content="#0f1419">

  <!-- SEO / Social Metadata -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta name="twitter:card" content="summary">

  <!-- MathJax -->
  <script type="text/javascript">
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'] }
    };
  </script>
  <script type="text/javascript" id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

<body>

  <header class="site-header">
    <div class="wrap">
      <a href="/" class="brand">Tomer Barak<span class="dot">.</span></a>
      <nav class="site-nav">
        <a href="/" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
        <a href="/projects/" {% if page.url contains 'projects' %}class="active"{% endif %}>Projects</a>
        <a href="/blog/" {% if page.url contains 'blog' %}class="active"{% endif %}>Blog</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="wrap">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span class="copy">&copy; {{ site.time | date: '%Y' }} Tomer Barak</span>
      <div class="footer-links">
        <a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener" aria-label="GitHub"><i
            class="fab fa-github"></i></a>
        <a href="{{ site.author.scholar }}" target="_blank" rel="noopener" aria-label="Google Scholar"><i
            class="fas fa-graduation-cap"></i></a>
        <a href="https://persopy.com" target="_blank" rel="noopener" aria-label="Persopy"><i
            class="fas fa-book"></i></a>
      </div>
    </div>
  </footer>

</body>

</html>
