---
layout: default
---

<article>
  <div class="page-head">
    <h1>{{ page.title }}</h1>
    <span class="meta">
      <span class="tag">{{ page.project }}</span>
      <span>{{ page.date | date: "%B %-d, %Y" }}</span>
    </span>
  </div>

  <div class="prose">
    {{ content }}
  </div>

  <div class="post-footer">
    <a href="{{ site.baseurl }}/projects/{{ page.project_slug }}/">← Back to project</a>
  </div>
</article>
