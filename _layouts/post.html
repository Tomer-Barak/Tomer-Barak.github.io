---
layout: default
---

<article>
  <div class="page-head">
    <h1>{{ page.title }}</h1>
    <span class="meta">
      <span>{{ page.date | date: "%B %-d, %Y" }}</span>
      {% if page.tags and page.tags.size > 0 %}<span class="tag">{{ page.tags | join: " · " }}</span>{% endif %}
    </span>
  </div>

  <div class="prose">
    {{ content }}
  </div>

  <div class="post-footer">
    <span class="k">Share</span>
    <a href="https://twitter.com/intent/tweet?text={{ page.title | url_encode }}&url={{ site.url }}{{ page.url | url_encode }}"
      target="_blank" rel="noopener">Twitter</a>
    <a href="mailto:?subject={{ page.title | url_encode }}&body={{ site.url }}{{ page.url | url_encode }}">Email</a>
    <a href="/blog/">← All posts</a>
  </div>
</article>
